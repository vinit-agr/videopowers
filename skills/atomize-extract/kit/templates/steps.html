<div class="inner center">
  <span class="kicker" data-slot="kicker">{{kicker}}</span>
  <h2 data-slot="headline">{{headline}}</h2>
  <div class="steps">
    {{#items}}<div class="panel step"><span class="n">{{.n}}</span><div><h3 data-slot="items.title">{{.title}}</h3>{{#.text}}<p data-slot="items.text">{{.text}}</p>{{/.text}}</div></div>{{/items}}
  </div>
</div>
