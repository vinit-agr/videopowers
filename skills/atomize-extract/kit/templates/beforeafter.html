<div class="inner center">
  <span class="kicker" data-slot="kicker">{{kicker}}</span>
  <h2 data-slot="headline">{{headline}}</h2>
  <div class="panel ba">
    {{#rows}}<div class="baRow"><span class="k" data-slot="rows.label">{{.label}}</span><span class="was" data-slot="rows.before">{{.before}}</span><span class="arrow">&rarr;</span><span class="now" data-slot="rows.after">{{.after}}</span></div>{{/rows}}
  </div>
  {{#note}}<p class="note" data-slot="note">{{note}}</p>{{/note}}
</div>
